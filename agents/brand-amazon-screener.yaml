name: brand-amazon-screener
type: llm_agent
project: fba-command-center
task: |
  Check if a brand actually exists on Amazon and assess its wholesale viability.

  STEP 1 — Browse Amazon:
  - Use browser_use to navigate to amazon.com and search for "{brand_name}"
  - Collect: total result count, price range on first page, top 3 product categories
  - Check for hazmat/restricted warnings, consumer vs B2B split
  - Note if Amazon itself is selling as the brand owner

  STEP 2 — Assess distribution model:
  - Brand-direct only (hard to get authorized)
  - Multi-distributor (good for wholesale)
  - Authorized dealer lockup (limited access)

  STEP 3 — Make a verdict:
  - PROCEED: brand is on Amazon, viable category, wholesaleable
  - SKIP: not on Amazon, hazmat-heavy, brand-direct lockup, or too few products
  - NEEDS_MANUAL: mixed signals, needs human review

  OUTPUT ONLY valid JSON matching the BrandScreenerResult schema.
input:
  brand_name:
    type: string
    required: true
    description: Operating brand name (post parent-corporate-resolver)
  source_context:
    type: string
    required: false
    description: Distributor context where this brand was found
output: BrandScreenerResult
tools: []
toolbox:
  - browser_use
model: openai:gpt-5.4
runtime:
  base_url: http://127.0.0.1:4096/v1
